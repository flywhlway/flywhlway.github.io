<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t d">
  <title id="t">模型蒸馏工程实现闭环</title>
  <desc id="d">数据管线、训练、采样与教师打分服务、部署灰度四个环节首尾相接，线上监控数据回流到数据管线，形成持续迭代闭环。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="arb" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="1280" height="560" rx="26" fill="url(#bg)"/>
  <text x="60" y="62" font-family="Arial, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#0F172A">模型蒸馏工程实现闭环</text>
  <text x="60" y="93" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#64748B">数据管线 → 训练 → 采样与教师打分 → 部署灰度，线上监控回流形成持续迭代</text>

  <!-- stage boxes -->
  <g font-family="Arial, PingFang SC, sans-serif">
    <!-- 1 data -->
    <rect x="60" y="150" width="255" height="230" rx="18" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#sh)"/>
    <rect x="60" y="150" width="255" height="46" rx="18" fill="#1D4ED8"/>
    <text x="187" y="180" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">① 数据管线</text>
    <text x="82" y="226" font-size="15.5" fill="#334155">• 教师批量采样（多候选）</text>
    <text x="82" y="256" font-size="15.5" fill="#334155">• 规则校验 + 生成式裁判</text>
    <text x="82" y="286" font-size="15.5" fill="#334155">• 拒绝采样保留合格轨迹</text>
    <text x="82" y="316" font-size="15.5" fill="#334155">• 去污染 / 去重（8-gram、MinHash）</text>
    <text x="82" y="346" font-size="15.5" fill="#334155">• 难度分箱 × 长度目标配比</text>

    <!-- 2 train -->
    <rect x="360" y="150" width="255" height="230" rx="18" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#sh)"/>
    <rect x="360" y="150" width="255" height="46" rx="18" fill="#0F766E"/>
    <text x="487" y="180" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">② 训练</text>
    <text x="382" y="226" font-size="15.5" fill="#334155">• 黑盒：轨迹 SFT</text>
    <text x="382" y="256" font-size="15.5" fill="#334155">• 白盒：KL / JSD 分布对齐</text>
    <text x="382" y="286" font-size="15.5" fill="#334155">• On-policy：GKD / MiniLLM</text>
    <text x="382" y="316" font-size="15.5" fill="#334155">• LoRA / QLoRA 参数高效</text>
    <text x="382" y="346" font-size="15.5" fill="#334155">• TRL / NeMo / EasyDistill</text>

    <!-- 3 serve -->
    <rect x="660" y="150" width="255" height="230" rx="18" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#sh)"/>
    <rect x="660" y="150" width="255" height="46" rx="18" fill="#B45309"/>
    <text x="787" y="180" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">③ 采样与教师打分</text>
    <text x="682" y="226" font-size="15.5" fill="#334155">• vLLM / SGLang 高吞吐 rollout</text>
    <text x="682" y="256" font-size="15.5" fill="#334155">• 采样与训练解耦（Ray / NCCL）</text>
    <text x="682" y="286" font-size="15.5" fill="#334155">• 教师无状态打分服务</text>
    <text x="682" y="316" font-size="15.5" fill="#334155">• prompt_logprobs 逐 token 打分</text>
    <text x="682" y="346" font-size="15.5" fill="#334155">• 跨 tokenizer：ULD / DSKD</text>

    <!-- 4 deploy -->
    <rect x="960" y="150" width="260" height="230" rx="18" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#sh)"/>
    <rect x="960" y="150" width="260" height="46" rx="18" fill="#7C3AED"/>
    <text x="1090" y="180" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">④ 部署灰度</text>
    <text x="982" y="226" font-size="15.5" fill="#334155">• 学生—教师级联 / 路由</text>
    <text x="982" y="256" font-size="15.5" fill="#334155">• 置信度 / 一致性阈值升级</text>
    <text x="982" y="286" font-size="15.5" fill="#334155">• 投机解码（draft = 蒸馏小模型）</text>
    <text x="982" y="316" font-size="15.5" fill="#334155">• shadow→1%→10%→…→100%</text>
    <text x="982" y="346" font-size="15.5" fill="#334155">• 自动回滚阈值</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#ar)">
    <line x1="315" y1="265" x2="356" y2="265"/>
    <line x1="615" y1="265" x2="656" y2="265"/>
    <line x1="915" y1="265" x2="956" y2="265"/>
  </g>

  <!-- feedback loop -->
  <path d="M1090 380 L1090 460 L187 460 L187 384" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arb)"/>
  <rect x="470" y="437" width="340" height="46" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="640" y="466" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#1D4ED8">⑤ 线上监控回流：时延 / 成功率 / 兜底率 / 失败轨迹</text>
</svg>
