<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">三类蒸馏训练路线的成本—效果关系示意图</title>
  <desc id="desc">横轴为累计训练计算成本，纵轴为Agent任务成功率。离线SFT较快起效但较早进入平台期，在线强化学习起效较慢，在线策略蒸馏以学生状态和教师稠密监督取得更陡的示意曲线。本图为机制示意，不代表通用实测数值。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1200" height="720" rx="28" fill="url(#bg)"/>
  <rect x="72" y="48" width="1056" height="606" rx="22" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="112" y="104" font-family="Arial, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#0F172A">训练计算成本与 Agent 任务成功率：三类路线的机制对比</text>
  <text x="112" y="139" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#64748B">概念示意图，不表示跨任务可复用的实测比例或绝对优势</text>

  <line x1="160" y1="555" x2="1045" y2="555" stroke="#334155" stroke-width="2"/>
  <line x1="160" y1="555" x2="160" y2="190" stroke="#334155" stroke-width="2"/>
  <path d="M1045 555 l-12 -7 v14 z" fill="#334155"/>
  <path d="M160 190 l-7 12 h14 z" fill="#334155"/>

  <g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="5 7">
    <line x1="160" y1="465" x2="1045" y2="465"/>
    <line x1="160" y1="375" x2="1045" y2="375"/>
    <line x1="160" y1="285" x2="1045" y2="285"/>
    <line x1="375" y1="190" x2="375" y2="555"/>
    <line x1="590" y1="190" x2="590" y2="555"/>
    <line x1="805" y1="190" x2="805" y2="555"/>
  </g>

  <text x="600" y="615" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="20" font-weight="600" fill="#334155">累计训练计算成本</text>
  <text x="73" y="372" transform="rotate(-90 73 372)" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="20" font-weight="600" fill="#334155">Agent 任务成功率</text>
  <text x="150" y="579" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="15" fill="#64748B">低</text>
  <text x="1044" y="579" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="15" fill="#64748B">高</text>
  <text x="136" y="559" text-anchor="end" font-family="Arial, PingFang SC, sans-serif" font-size="15" fill="#64748B">低</text>
  <text x="136" y="198" text-anchor="end" font-family="Arial, PingFang SC, sans-serif" font-size="15" fill="#64748B">高</text>

  <path d="M168 535 C235 415, 320 344, 435 316 C560 286, 735 283, 1018 282" fill="none" stroke="#64748B" stroke-width="7" stroke-linecap="round"/>
  <path d="M168 540 C315 530, 420 492, 520 428 C660 338, 790 260, 1018 220" fill="none" stroke="#F59E0B" stroke-width="7" stroke-linecap="round"/>
  <path d="M168 537 C238 481, 302 373, 400 305 C525 219, 690 202, 1018 197" fill="none" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>

  <circle cx="435" cy="316" r="8" fill="#64748B"/>
  <text x="458" y="306" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#475569">分布偏移导致较早平台期</text>
  <circle cx="520" cy="428" r="8" fill="#F59E0B"/>
  <text x="540" y="451" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#92400E">结果奖励稀疏，早期提升较慢</text>
  <circle cx="400" cy="305" r="8" fill="#2563EB"/>
  <text x="421" y="280" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#1D4ED8">学生状态 + 教师稠密监督</text>

  <g transform="translate(690,495)">
    <rect x="0" y="0" width="335" height="118" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <line x1="22" y1="28" x2="70" y2="28" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
    <text x="84" y="34" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155">Off-policy SFT</text>
    <line x1="22" y1="58" x2="70" y2="58" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
    <text x="84" y="64" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#334155">On-policy RL</text>
    <line x1="22" y1="88" x2="70" y2="88" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>
    <text x="84" y="94" font-family="Arial, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#1D4ED8">On-policy Distillation</text>
  </g>
</svg>
