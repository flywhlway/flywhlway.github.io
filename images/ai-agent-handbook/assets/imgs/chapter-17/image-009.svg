<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="870" viewBox="0 0 1560 870" role="img" aria-labelledby="t d">
  <title id="t">黑盒 vs 白盒蒸馏路线决策树</title>
  <desc id="d">从教师信号形态出发的四步决策：能否获取教师 logits、师生是否共享 tokenizer、是否愿意做跨词表对齐、是否需要 on-policy 覆盖学生状态，最终落到黑盒序列级、白盒跨词表、白盒 on-policy 或白盒离线 logits-KD 四类落地路线。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <filter id="sh" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="ar" markerWidth="11" markerHeight="11" refX="8.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1560" height="870" rx="24" fill="url(#bg)"/>
  <text x="44" y="48" font-family="Arial, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#0F172A">黑盒 vs 白盒蒸馏路线决策树</text>
  <text x="44" y="76" font-family="Arial, PingFang SC, sans-serif" font-size="15.5" fill="#64748B">从“教师能提供什么信号”出发，四步选定可落地的蒸馏路线</text>

  <!-- connectors -->
  <g stroke="#475569" stroke-width="2.4" fill="none">
    <line x1="760" y1="133" x2="760" y2="160" marker-end="url(#ar)"/>
    <path d="M590 220 H210 V321" marker-end="url(#ar)"/>
    <path d="M760 278 V297 H900 V315" marker-end="url(#ar)"/>
    <path d="M735 375 H560 V496" marker-end="url(#ar)"/>
    <path d="M1065 375 H1230 V496" marker-end="url(#ar)"/>
    <path d="M380 560 H300 V705" marker-end="url(#ar)"/>
    <path d="M740 560 H700 V711" marker-end="url(#ar)"/>
    <path d="M1050 560 V701" marker-end="url(#ar)"/>
    <path d="M1410 560 H1400 V701" marker-end="url(#ar)"/>
  </g>
  <!-- edge labels -->
  <g font-family="Arial, PingFang SC, sans-serif" font-size="15" font-weight="700">
    <text x="392" y="211" fill="#B91C1C">否</text>
    <text x="792" y="291" fill="#15803D">是</text>
    <text x="628" y="366" fill="#B91C1C">否</text>
    <text x="1140" y="366" fill="#15803D">是</text>
    <text x="322" y="551" fill="#15803D">是</text>
    <text x="712" y="551" fill="#B91C1C">否</text>
    <text x="1016" y="636" fill="#15803D">是</text>
    <text x="1420" y="636" fill="#B91C1C">否</text>
  </g>

  <!-- root -->
  <rect x="600" y="87" width="320" height="46" rx="12" fill="#0F172A" filter="url(#sh)"/>
  <text x="760" y="116" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">确定蒸馏路线</text>

  <!-- decisions -->
  <g font-family="Arial, PingFang SC, sans-serif" text-anchor="middle">
    <polygon points="760,162 930,220 760,278 590,220" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.4" filter="url(#sh)"/>
    <text x="760" y="214" font-size="15.5" font-weight="700" fill="#1D4ED8">① 能拿到教师</text>
    <text x="760" y="236" font-size="15.5" font-weight="700" fill="#1D4ED8">logits / log-prob？</text>

    <polygon points="900,317 1065,375 900,433 735,375" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.4" filter="url(#sh)"/>
    <text x="900" y="369" font-size="15.5" font-weight="700" fill="#1D4ED8">② 师生共享</text>
    <text x="900" y="391" font-size="15.5" font-weight="700" fill="#1D4ED8">tokenizer / 词表？</text>

    <polygon points="560,498 740,560 560,622 380,560" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.4" filter="url(#sh)"/>
    <text x="560" y="554" font-size="15" font-weight="700" fill="#1D4ED8">③ 愿意做跨词表对齐？</text>
    <text x="560" y="576" font-size="13" fill="#475569">ULD / DSKD / MultiLevelOT</text>

    <polygon points="1230,498 1410,560 1230,622 1050,560" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.4" filter="url(#sh)"/>
    <text x="1230" y="554" font-size="15" font-weight="700" fill="#1D4ED8">④ 需要 on-policy</text>
    <text x="1230" y="576" font-size="15" font-weight="700" fill="#1D4ED8">覆盖学生真实状态？</text>
  </g>

  <!-- terminals -->
  <g font-family="Arial, PingFang SC, sans-serif" text-anchor="middle">
    <!-- A: black-box -->
    <rect x="25" y="323" width="370" height="104" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.2" filter="url(#sh)"/>
    <text x="210" y="352" font-size="16.5" font-weight="700" fill="#334155">黑盒 · 序列级路线</text>
    <text x="210" y="378" font-size="13.5" fill="#475569">教师轨迹 → 规则/裁判验证 → SFT</text>
    <text x="210" y="400" font-size="13.5" fill="#475569">跨厂商 / 跨词表通用（DeepSeek-R1、Qwen3）</text>

    <!-- B: white-box cross-tokenizer -->
    <rect x="150" y="707" width="300" height="96" rx="14" fill="#ECFEFF" stroke="#0891B2" stroke-width="2.2" filter="url(#sh)"/>
    <text x="300" y="736" font-size="16.5" font-weight="700" fill="#0E7490">白盒 · 跨词表蒸馏</text>
    <text x="300" y="762" font-size="13.5" fill="#155E75">ULD / DSKD / MultiLevelOT 分布对齐</text>
    <text x="300" y="784" font-size="13.5" fill="#155E75">实现与算力复杂度高</text>

    <!-- A2: fallback -->
    <rect x="575" y="713" width="250" height="84" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.2" filter="url(#sh)"/>
    <text x="700" y="748" font-size="16" font-weight="700" fill="#334155">回退黑盒 · 序列级</text>
    <text x="700" y="773" font-size="13.5" fill="#475569">门槛最低、最稳妥</text>

    <!-- C: white-box on-policy -->
    <rect x="890" y="703" width="320" height="104" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2" filter="url(#sh)"/>
    <text x="1050" y="732" font-size="16.5" font-weight="700" fill="#1D4ED8">白盒 · On-policy 蒸馏</text>
    <text x="1050" y="758" font-size="13.5" fill="#1E40AF">GKD(lmbda&gt;0) / MiniLLM / Async</text>
    <text x="1050" y="780" font-size="13.5" fill="#1E40AF">+ 教师打分服务（vLLM prompt_logprobs）</text>

    <!-- DE: white-box offline -->
    <rect x="1250" y="703" width="300" height="104" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2" filter="url(#sh)"/>
    <text x="1400" y="732" font-size="16.5" font-weight="700" fill="#1D4ED8">白盒 · 离线 logits-KD</text>
    <text x="1400" y="758" font-size="13" fill="#1E40AF">显存足→top-K logits 缓存（NeMo，降序）</text>
    <text x="1400" y="780" font-size="13" fill="#1E40AF">紧张→分块 JSD（DistillationTrainer）</text>
  </g>

  <!-- legend -->
  <g font-family="Arial, PingFang SC, sans-serif" font-size="13.5">
    <rect x="25" y="828" width="18" height="14" rx="3" fill="#F1F5F9" stroke="#64748B"/>
    <text x="50" y="840" fill="#475569">黑盒（无需教师概率/权重）</text>
    <rect x="290" y="828" width="18" height="14" rx="3" fill="#EFF6FF" stroke="#2563EB"/>
    <text x="315" y="840" fill="#475569">白盒（需 logits/log-prob，通常同词表）</text>
    <rect x="640" y="828" width="18" height="14" rx="3" fill="#ECFEFF" stroke="#0891B2"/>
    <text x="665" y="840" fill="#475569">白盒 + 跨词表对齐</text>
  </g>
</svg>
