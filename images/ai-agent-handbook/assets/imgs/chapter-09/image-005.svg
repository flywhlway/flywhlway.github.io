  <g id="labels">
    <text x="64" y="34" font-size="15" fill="#526579" font-weight="600" text-anchor="start">AI GATEWAY  /  第 10 章  /  图 10-5</text>
    <text x="64" y="86" font-size="38" fill="#192D43" font-weight="600" text-anchor="start">有拒绝与异步审批的治理流程</text>
    <text x="64" y="123" font-size="20" fill="#526579" font-weight="400" text-anchor="start">审批等待与请求连接解耦；批准后仍须重新校验，所有执行路径均需预算准入。</text>
    <text x="64" y="872" font-size="18" fill="#526579" font-weight="400" text-anchor="start">图注｜所有拒绝与超时均终止并审计；审批状态归业务审批服务，网关不长时间持有 HTTP 连接。</text>
    <text x="144.0" y="232.0" font-size="23" fill="#192D43" font-weight="600" text-anchor="middle">请求</text>
    <text x="393.0" y="232.0" font-size="23" fill="#192D43" font-weight="600" text-anchor="middle">认证</text>
    <text x="700.0" y="232.0" font-size="23" fill="#192D43" font-weight="600" text-anchor="middle">授权 / 风险</text>
    <text x="1057.0" y="232.0" font-size="23" fill="#166D69" font-weight="600" text-anchor="middle">低风险预算准入</text>
    <text x="1408.0" y="218.0" font-size="22" fill="#A1454F" font-weight="600" text-anchor="middle">终止与拒绝审计</text>
    <text x="1408.0" y="251.0" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">认证 / 授权 / 预算失败</text>
    <text x="1232" y="206" font-size="17" fill="#A1454F" font-weight="400" text-anchor="middle">不足</text>
    <text x="700.0" y="376.5" font-size="26" fill="#885B17" font-weight="600" text-anchor="middle">业务审批服务</text>
    <text x="700.0" y="409.5" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">持久化：待审批</text>
    <text x="728" y="309" font-size="19" fill="#885B17" font-weight="400" text-anchor="start">高风险</text>
    <text x="700.0" y="514.0" font-size="24" fill="#166D69" font-weight="600" text-anchor="middle">批准</text>
    <text x="1025.0" y="514.0" font-size="24" fill="#A1454F" font-weight="600" text-anchor="middle">拒绝</text>
    <text x="1345.0" y="514.0" font-size="24" fill="#A1454F" font-weight="600" text-anchor="middle">超时</text>
    <text x="578" y="623" font-size="24" fill="#245B93" font-weight="600" text-anchor="start">批准后重新校验与预留</text>
    <text x="578" y="654" font-size="21" fill="#192D43" font-weight="400" text-anchor="start">身份权限 · 参数摘要绑定</text>
    <text x="578" y="684" font-size="21" fill="#192D43" font-weight="400" text-anchor="start">审批有效期 · 预算预留</text>
    <text x="1305.0" y="639.0" font-size="24" fill="#A1454F" font-weight="600" text-anchor="middle">终止与拒绝审计</text>
    <text x="1305.0" y="672.0" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">拒绝 / 超时 / 再校验或预留失败</text>
    <text x="1072" y="628" font-size="17" fill="#A1454F" font-weight="400" text-anchor="middle">失败</text>
    <text x="1167.0" y="798.0" font-size="24" fill="#166D69" font-weight="600" text-anchor="middle">实际执行</text>
    <text x="1430.5" y="798.0" font-size="22" fill="#192D43" font-weight="600" text-anchor="middle">最终结果审计</text>
    <text x="808" y="720" font-size="17" fill="#166D69" font-weight="400" text-anchor="start">全部通过</text>
    <text x="1268" y="283" font-size="17" fill="#166D69" font-weight="400" text-anchor="start">低风险准入路径</text>
    <text x="88" y="371" font-size="25" fill="#192D43" font-weight="600" text-anchor="start">异步等待</text>
    <text x="88" y="408" font-size="21" fill="#526579" font-weight="400" text-anchor="start">持久化待审批后返回审批标识</text>
    <text x="88" y="440" font-size="21" fill="#526579" font-weight="400" text-anchor="start">等待不等于请求已获准执行</text>
    <text x="88" y="527" font-size="25" fill="#192D43" font-weight="600" text-anchor="start">状态与连接边界</text>
    <text x="88" y="566" font-size="21" fill="#526579" font-weight="400" text-anchor="start">审批状态归业务审批服务</text>
    <text x="88" y="600" font-size="20" fill="#526579" font-weight="400" text-anchor="start">网关不长时间持有 HTTP 连接</text>
    <text x="88" y="640" font-size="21" fill="#A1454F" font-weight="600" text-anchor="start">拒绝与超时：终止并审计</text>
    <text x="88" y="677" font-size="21" fill="#A1454F" font-weight="600" text-anchor="start">超时不自动转为只读</text>
    <text x="88" y="783" font-size="20" fill="#526579" font-weight="400" text-anchor="start">低风险与审批通过路径汇合于同一执行节点</text>
