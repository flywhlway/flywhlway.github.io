<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="figure-title figure-description" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <title id="figure-title">图 10-5　有拒绝与异步审批的治理流程</title>
  <desc id="figure-description">请求经认证与授权风险判定。低风险路径仍须预算准入；高风险由业务审批服务持久化为待审批状态，网关不长时间持有 HTTP 连接。审批可批准、拒绝或超时。批准后重新校验身份权限、校验参数摘要绑定与审批有效期、完成预算预留后才实际执行，最终结果进入审计。认证或授权不通过、预算不足、审批拒绝、超时以及批准后再校验或预留失败，全部终止并审计。超时不得默认转为只读。图中只有一个实际执行节点。</desc>
