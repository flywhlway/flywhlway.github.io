    <text x="64" y="86" font-size="38" fill="#192D43" font-weight="600" text-anchor="start">Task 账本与执行责任边界</text>
    <text x="64" y="123" font-size="20" fill="#526579" font-weight="400" text-anchor="start">业务定义结果，编排组织执行，运行时保障生命周期；网关只治理流量。</text>
    <text x="64" y="872" font-size="18" fill="#526579" font-weight="400" text-anchor="start">图注｜一个 Task 可跨 Session 及恢复；子 Task 必须显式关联。Trace 不是权威 Task 账本。</text>
    <text x="92" y="221" font-size="28" fill="#245B93" font-weight="600" text-anchor="start">业务应用与结果验证</text>
