<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="figure-title figure-description" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <title id="figure-title">图 10-4　Task 账本与执行责任边界</title>
  <desc id="figure-description">业务应用拥有 Task 定义、成功标准与权威 Task 账本；业务应用或获授权 Verifier 判定 Outcome。Harness 或 Orchestrator 组织控制循环并维护执行状态。Agent Runtime 承担执行生命周期、Checkpoint 持久化及基础设施恢复。Task/State 定义业务状态及恢复规则并约束执行层。Gateway 只负责身份、配额、路由、亲和与关联观测，不持有业务 State 或 Checkpoint 语义。关联链是 task_id 到 session_id 到 turn_id 到 model/tool call 到 attempt；Task 可跨 Session 及恢复，子 Task 显式关联，Trace 不是权威 Task 账本。</desc>
