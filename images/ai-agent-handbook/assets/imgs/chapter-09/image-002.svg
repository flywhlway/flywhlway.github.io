  <g id="labels">
    <text x="64" y="34" font-size="15" fill="#526579" font-weight="600" text-anchor="start">AI GATEWAY  /  第 10 章  /  图 10-2</text>
    <text x="64" y="86" font-size="38" fill="#192D43" font-weight="600" text-anchor="start">模型调用准入与预算结算</text>
    <text x="64" y="123" font-size="20" fill="#526579" font-weight="400" text-anchor="start">软阈值只检查；严格预算先证明最大成本并原子预留，再调用与结算。</text>
    <text x="64" y="872" font-size="18" fill="#526579" font-weight="400" text-anchor="start">图注｜硬预算约束依赖可证明的最大成本与原子预留；检查后结算的软阈值路径不能保证硬上限。</text>
    <text x="144.0" y="227.0" font-size="24" fill="#192D43" font-weight="600" text-anchor="middle">请求</text>
    <text x="416.0" y="227.0" font-size="24" fill="#192D43" font-weight="600" text-anchor="middle">身份权限</text>
    <text x="743.0" y="227.0" font-size="24" fill="#192D43" font-weight="600" text-anchor="middle">配额策略</text>
    <text x="1296.0" y="217.0" font-size="24" fill="#A1454F" font-weight="600" text-anchor="middle">拒绝 / 不调用</text>
    <text x="1296.0" y="250.0" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">校验不通过、成本无法证明或预留失败</text>
    <text x="939" y="202" font-size="17" fill="#A1454F" font-weight="400" text-anchor="middle">不通过</text>
    <text x="88" y="357" font-size="23" fill="#245B93" font-weight="600" text-anchor="start">软阈值路径</text>
    <text x="88" y="421" font-size="19" fill="#526579" font-weight="400" text-anchor="start">只检查，后结算</text>
    <text x="1508" y="354" font-size="19" fill="#245B93" font-weight="400" text-anchor="end">不承诺硬上限</text>
    <text x="445.0" y="427.0" font-size="23" fill="#192D43" font-weight="600" text-anchor="middle">检查当前预算用量</text>
    <text x="845.0" y="427.0" font-size="23" fill="#192D43" font-weight="600" text-anchor="middle">调用</text>
    <text x="1285.0" y="427.0" font-size="23" fill="#192D43" font-weight="600" text-anchor="middle">按实际用量结算</text>
    <text x="760" y="356" font-size="17" fill="#A1454F" font-weight="400" text-anchor="start">阈值不通过</text>
    <text x="88" y="537" font-size="23" fill="#885B17" font-weight="600" text-anchor="start">严格预算路径</text>
    <text x="88" y="614" font-size="19" fill="#526579" font-weight="400" text-anchor="start">先预留，后调用</text>
    <text x="428.0" y="612.0" font-size="22" fill="#192D43" font-weight="600" text-anchor="middle">可证明最大成本</text>
    <text x="730.0" y="612.0" font-size="22" fill="#192D43" font-weight="600" text-anchor="middle">原子预留</text>
    <text x="1018.0" y="612.0" font-size="22" fill="#192D43" font-weight="600" text-anchor="middle">调用</text>
    <text x="1352.0" y="612.0" font-size="22" fill="#192D43" font-weight="600" text-anchor="middle">实际用量结算 / 退款</text>
    <text x="448" y="679" font-size="17" fill="#A1454F" font-weight="400" text-anchor="start">无法证明</text>
    <text x="750" y="679" font-size="17" fill="#A1454F" font-weight="400" text-anchor="start">预留失败</text>
    <text x="82" y="777" font-size="20" fill="#192D43" font-weight="600" text-anchor="start">重试：每个 attempt 单独预留</text>
    <text x="82" y="803" font-size="17" fill="#526579" font-weight="400" text-anchor="start">适用于严格预算路径</text>
    <text x="584" y="777" font-size="20" fill="#192D43" font-weight="600" text-anchor="start">结算：以 attempt 为单位幂等</text>
    <text x="584" y="803" font-size="17" fill="#526579" font-weight="400" text-anchor="start">重复回报不得重复扣费</text>
    <text x="1086" y="777" font-size="20" fill="#192D43" font-weight="600" text-anchor="start">usage 缺失：保持待对账</text>
    <text x="1086" y="803" font-size="17" fill="#526579" font-weight="400" text-anchor="start">不得视为零成本</text>
