  <title id="figure-title">图 10-2　模型调用准入与预算结算</title>
  <desc id="figure-description">请求经过身份权限与配额策略。软阈值路径检查当前预算用量，调用后按实际用量结算，不承诺硬上限。严格预算路径依次证明最大成本、原子预留、调用、实际用量结算或退款。身份或策略不通过、阈值不通过、无法证明最大成本及预留失败均拒绝调用。严格预算的每次重试 attempt 单独预留，结算幂等。usage 缺失时保持待对账，不视为零成本。</desc>
