<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="figure-title figure-description" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <title id="figure-title">图 10-3　MCP发现、授权与执行的分离</title>
  <desc id="figure-description">外部 Registry 是独立资源与数据面，通过虚线提供端点、版本、能力目录，不内嵌 Gateway。Agent 请求经 Gateway 身份、参数、工具授权后，发往 MCP Server 或 REST 适配。可发现不等于获授权，获授权不等于可执行。桥接只声明 modern 下游到 legacy 上游的单向路径，仅对已核验实现适用；legacy 到 modern 未声明支持。入口不可绕过还依赖凭证收敛、出口受控与禁止直连。</desc>
  <rect x="0" y="0" width="1600" height="900" fill="#F8FAFC" />
  <g id="panels">
    <path d="M 64 145 L 1536 145" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 64 834 L 1536 834" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="440" y="584" width="670" height="49" rx="16" fill="#ECF7F4" stroke="#ECF7F4" stroke-width="1.3" />
    <rect x="64" y="530" width="302" height="105" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" />
    <rect x="64" y="675" width="1472" height="132" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" />
  </g>
  <g id="connectors">
    <path d="M 815 278 L 815 337" fill="none" stroke="#68518B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7" />
    <path d="M 815 337 L 819.0 328.0 L 811.0 328.0 Z" fill="#68518B" data-arrow="true" />
    <path d="M 314 443 L 440 443" fill="none" stroke="#192D43" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 440 443 L 431.0 439.0 L 431.0 447.0 Z" fill="#192D43" data-arrow="true" />
    <path d="M 1110 443 L 1172 443 L 1172 384 L 1240 384" fill="none" stroke="#192D43" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 1240 384 L 1231.0 380.0 L 1231.0 388.0 Z" fill="#192D43" data-arrow="true" />
    <path d="M 1172 443 L 1172 517 L 1240 517" fill="none" stroke="#192D43" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 1240 517 L 1231.0 513.0 L 1231.0 521.0 Z" fill="#192D43" data-arrow="true" />
    <path d="M 666 728.5 L 841 728.5" fill="none" stroke="#192D43" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 841 728.5 L 832.0 724.5 L 832.0 732.5 Z" fill="#192D43" data-arrow="true" />
  </g>
  <g id="nodes">
    <rect x="490" y="174" width="650" height="104" rx="14" fill="#F3F0F8" stroke="#68518B" stroke-width="1.3" id="registry" data-node="true" />
    <rect x="64" y="390" width="250" height="106" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" id="agent" data-node="true" />
    <rect x="440" y="337" width="670" height="212" rx="14" fill="#EDF4FB" stroke="#245B93" stroke-width="1.3" id="gateway" data-node="true" />
    <rect x="466" y="412" width="193" height="101" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" />
    <rect x="678" y="412" width="193" height="101" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" />
    <rect x="890" y="412" width="193" height="101" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" />
    <rect x="1240" y="337" width="296" height="94" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" id="mcp-server" data-node="true" />
    <rect x="1240" y="470" width="296" height="94" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" id="rest-adapter" data-node="true" />
    <rect x="430" y="697" width="236" height="63" rx="14" fill="#EDF4FB" stroke="#245B93" stroke-width="1.3" id="modern" data-node="true" />
    <rect x="841" y="697" width="236" height="63" rx="14" fill="#ECF7F4" stroke="#166D69" stroke-width="1.3" id="legacy" data-node="true" />
  </g>
  <g id="labels">
    <text x="64" y="34" font-size="15" fill="#526579" font-weight="600" text-anchor="start">AI GATEWAY  /  第 10 章  /  图 10-3</text>
    <text x="64" y="86" font-size="38" fill="#192D43" font-weight="600" text-anchor="start">MCP发现、授权与执行的分离</text>
    <text x="64" y="123" font-size="20" fill="#526579" font-weight="400" text-anchor="start">目录回答“在哪里、有什么”；网关判断“谁可调用、以何参数调用”。</text>
    <text x="64" y="872" font-size="18" fill="#526579" font-weight="400" text-anchor="start">图注｜发现不授予执行权；入口不可绕过依赖凭证收敛、出口受控和禁止直连，而非仅部署网关。</text>
    <text x="815.0" y="220.0" font-size="27" fill="#68518B" font-weight="600" text-anchor="middle">外部 Registry｜资源与数据面</text>
    <text x="815.0" y="253.0" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">独立于 Gateway 部署</text>
    <text x="847" y="312" font-size="19" fill="#68518B" font-weight="400" text-anchor="start">端点 / 版本 / 能力目录</text>
    <text x="189.0" y="437.0" font-size="28" fill="#192D43" font-weight="600" text-anchor="middle">Agent</text>
    <text x="189.0" y="470.0" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">发起工具调用</text>
    <text x="468" y="381" font-size="29" fill="#245B93" font-weight="600" text-anchor="start">MCP Gateway</text>
    <text x="562.5" y="451" font-size="24" fill="#192D43" font-weight="600" text-anchor="middle">身份校验</text>
    <text x="562.5" y="487" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">确认调用主体</text>
    <text x="774.5" y="451" font-size="24" fill="#192D43" font-weight="600" text-anchor="middle">参数校验</text>
    <text x="774.5" y="487" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">约束调用输入</text>
    <text x="986.5" y="451" font-size="24" fill="#192D43" font-weight="600" text-anchor="middle">工具授权</text>
    <text x="986.5" y="487" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">限定可用工具</text>
    <text x="1388.0" y="378.0" font-size="26" fill="#192D43" font-weight="600" text-anchor="middle">MCP Server</text>
    <text x="1388.0" y="411.0" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">按服务能力执行</text>
    <text x="1388.0" y="511.0" font-size="26" fill="#192D43" font-weight="600" text-anchor="middle">REST 适配</text>
    <text x="1388.0" y="544.0" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">受控 REST 工具调用</text>
    <text x="1172" y="551" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">已授权请求</text>
    <text x="775" y="617" font-size="26" fill="#166D69" font-weight="600" text-anchor="middle">可发现 ≠ 获授权 ≠ 可执行</text>
    <text x="84" y="559" font-size="20" fill="#192D43" font-weight="600" text-anchor="start">入口不可绕过的前提</text>
    <text x="84" y="590" font-size="19" fill="#526579" font-weight="400" text-anchor="start">凭证收敛 + 出口受控</text>
    <text x="84" y="619" font-size="19" fill="#526579" font-weight="400" text-anchor="start">并禁止客户端直连</text>
    <text x="88" y="715" font-size="24" fill="#192D43" font-weight="600" text-anchor="start">有向协议桥接</text>
    <text x="548.0" y="736.5" font-size="24" fill="#245B93" font-weight="600" text-anchor="middle">modern 下游</text>
    <text x="959.0" y="736.5" font-size="24" fill="#166D69" font-weight="600" text-anchor="middle">legacy 上游</text>
    <text x="1108" y="735" font-size="22" fill="#885B17" font-weight="600" text-anchor="start">仅已核验实现适用</text>
    <text x="430" y="792" font-size="19" fill="#526579" font-weight="400" text-anchor="start">仅声明 modern → legacy；legacy → modern 未声明支持。</text>
  </g>
</svg>