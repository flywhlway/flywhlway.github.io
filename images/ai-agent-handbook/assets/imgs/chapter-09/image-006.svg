<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="figure-title figure-description" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <title id="figure-title">图 10-6　评估经验证与授权进入生产</title>
  <desc id="figure-description">Evaluation 评分诊断生成候选变更，经构建回归安全验证、治理授权发布门禁，进入灰度控制面后由 Gateway 执行；Gateway 观测反馈 Evaluation 形成闭环，不允许 Evaluation 直接写控制面。Gateway 分别向模型服务、MCP Server 和 Agent Runtime 三种不同端点发送请求。外部 Registry 或服务发现为控制面提供端点及健康信息。实线表示请求，点线表示观测，长虚线表示候选变更，点划线表示发布配置或发现。低风险自动调整必须处于预授权范围，仍通过验证与发布门禁。</desc>
