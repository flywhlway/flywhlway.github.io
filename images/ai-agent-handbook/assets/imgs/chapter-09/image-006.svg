  <g id="labels">
    <text x="64" y="34" font-size="15" fill="#526579" font-weight="600" text-anchor="start">AI GATEWAY  /  第 10 章  /  图 10-6</text>
    <text x="64" y="86" font-size="38" fill="#192D43" font-weight="600" text-anchor="start">评估经验证与授权进入生产</text>
    <text x="64" y="123" font-size="20" fill="#526579" font-weight="400" text-anchor="start">Evaluation 产出候选变更；验证与治理门禁之后，变更才可进入灰度和控制面。</text>
    <text x="64" y="872" font-size="18" fill="#526579" font-weight="400" text-anchor="start">图注｜评估不能直接驱动控制面；低风险自动调整也必须在预授权范围内，并经过验证与发布门禁。</text>
    <text x="195.0" y="228.0" font-size="24" fill="#68518B" font-weight="600" text-anchor="middle">Evaluation</text>
    <text x="195.0" y="261.0" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">评分 / 诊断</text>
    <text x="503.5" y="228.0" font-size="24" fill="#68518B" font-weight="600" text-anchor="middle">候选变更</text>
    <text x="503.5" y="261.0" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">策略 / 配置提案</text>
    <text x="846.0" y="228.0" font-size="24" fill="#192D43" font-weight="600" text-anchor="middle">构建 / 回归 / 安全验证</text>
    <text x="846.0" y="261.0" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">验证未通过，不进入发布</text>
    <text x="1302.0" y="228.0" font-size="24" fill="#192D43" font-weight="600" text-anchor="middle">治理授权 / 发布门禁</text>
    <text x="1302.0" y="261.0" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">在授权范围内放行或阻断</text>
    <text x="841.0" y="432.0" font-size="25" fill="#68518B" font-weight="600" text-anchor="middle">Registry / 服务发现</text>
    <text x="841.0" y="465.0" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">提供端点与健康信息</text>
    <text x="1333.0" y="432.0" font-size="27" fill="#245B93" font-weight="600" text-anchor="middle">灰度 / 控制面</text>
    <text x="1333.0" y="465.0" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">分发已获授权的有效配置</text>
    <text x="1273" y="339" font-size="18" fill="#526579" font-weight="400" text-anchor="end">验证与授权通过</text>
    <text x="860.0" y="604.0" font-size="26" fill="#245B93" font-weight="600" text-anchor="middle">Gateway 执行</text>
    <text x="860.0" y="637.0" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">按已生效策略处理请求</text>
    <text x="522.0" y="604.0" font-size="24" fill="#192D43" font-weight="600" text-anchor="middle">调用方</text>
    <text x="522.0" y="637.0" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">发起线上请求</text>
    <text x="1383.0" y="594.5" font-size="25" fill="#192D43" font-weight="600" text-anchor="middle">模型服务</text>
    <text x="1383.0" y="695.5" font-size="25" fill="#192D43" font-weight="600" text-anchor="middle">MCP Server</text>
    <text x="1383.0" y="796.5" font-size="25" fill="#192D43" font-weight="600" text-anchor="middle">Agent Runtime</text>
    <text x="1160" y="540" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">不同执行端点</text>
    <text x="196.0" y="614.0" font-size="26" fill="#166D69" font-weight="600" text-anchor="middle">观测</text>
    <text x="196.0" y="647.0" font-size="18" fill="#526579" font-weight="400" text-anchor="middle">用量 / 质量 / 失败信号</text>
    <text x="480" y="740" font-size="18" fill="#166D69" font-weight="400" text-anchor="start">观测反馈</text>
    <text x="88" y="399" font-size="24" fill="#192D43" font-weight="600" text-anchor="start">低风险自动调整也受门禁约束</text>
    <text x="88" y="436" font-size="22" fill="#526579" font-weight="400" text-anchor="start">必须位于预授权范围内</text>
    <text x="88" y="477" font-size="21" fill="#526579" font-weight="400" text-anchor="start">仍须验证与发布门禁；不直接写控制面</text>
    <text x="157" y="802" font-size="18" fill="#526579" font-weight="400" text-anchor="start">请求</text>
    <text x="347" y="802" font-size="18" fill="#526579" font-weight="400" text-anchor="start">观测</text>
    <text x="537" y="802" font-size="18" fill="#526579" font-weight="400" text-anchor="start">候选变更</text>
    <text x="809" y="802" font-size="18" fill="#526579" font-weight="400" text-anchor="start">发布 / 配置 / 发现</text>
