<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="590" viewBox="0 0 1400 590" role="img" aria-labelledby="title desc">
  <title id="title">PatchPilot 实践成果</title><desc id="desc">截至2026年9月15日的版本覆盖、补丁处理、AI解冲突和交付效率成果</desc>
  <defs><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#2F628D"/><stop offset="1" stop-color="#16866F"/></linearGradient></defs>
  <rect width="1400" height="590" fill="#FFFFFF"/><rect x="1" y="1" width="1398" height="588" rx="20" fill="none" stroke="#B9CBD9" stroke-width="2"/>
  <text x="64" y="70" fill="#163B5C" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="35" font-weight="700">实践成果：将复杂补丁交付变成规模化能力</text>
  <text x="64" y="108" fill="#5B7185" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19">截至 2026.09.15 · 覆盖 Linux 5.10、6.6 等多个内核版本</text>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <g transform="translate(64 164)"><rect width="290" height="196" rx="14" fill="#EFF6FA"/><text x="28" y="43" fill="#2F628D" font-size="18" font-weight="700">版本覆盖</text><text x="28" y="110" fill="#163B5C" font-size="54" font-weight="800">10</text><text x="28" y="150" fill="#5B7185" font-size="20">个版本任务</text><text x="28" y="178" fill="#5B7185" font-size="16">覆盖多个内核版本</text></g>
    <g transform="translate(382 164)"><rect width="290" height="196" rx="14" fill="#EFF6FA"/><text x="28" y="43" fill="#2F628D" font-size="18" font-weight="700">处理规模</text><text x="28" y="110" fill="#163B5C" font-size="54" font-weight="800">10,000+</text><text x="28" y="150" fill="#5B7185" font-size="20">累计处理补丁</text><text x="28" y="178" fill="#5B7185" font-size="16">支撑数千个 CVE 修复</text></g>
    <g transform="translate(700 164)"><rect width="290" height="196" rx="14" fill="#E7F7F3"/><text x="28" y="43" fill="#137B66" font-size="18" font-weight="700">技术突破</text><text x="28" y="110" fill="#124E49" font-size="54" font-weight="800">1,200</text><text x="28" y="150" fill="#47736D" font-size="20">AI 解冲突成功任务</text><text x="28" y="178" fill="#47736D" font-size="16">应对复杂跨版本冲突</text></g>
    <g transform="translate(1018 164)"><rect width="318" height="196" rx="14" fill="#E7F7F3"/><text x="28" y="43" fill="#137B66" font-size="18" font-weight="700">交付成果</text><text x="28" y="110" fill="#124E49" font-size="54" font-weight="800">4,983</text><text x="28" y="150" fill="#47736D" font-size="20">已合入 PR</text><text x="28" y="178" fill="#47736D" font-size="16">端到端完成交付</text></g>
  </g>
  <rect x="64" y="402" width="1272" height="104" rx="14" fill="#F4F8FA"/>
  <text x="106" y="443" fill="#2F628D" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">效率提升</text>
  <text x="620" y="485" text-anchor="end" fill="#163B5C" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="800">单个版本交付周期：约 2 个月</text>
  <path d="M650 475 H750" stroke="url(#accent)" stroke-width="5"/><path d="M740 462 l24 13 -24 13" fill="#16866F"/>
  <text x="790" y="485" fill="#137B66" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="800">1–2 周</text>
  <text x="64" y="552" fill="#5B7185" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17">以流程编排、AI 解冲突与质量校验协同，将补丁回合从专家手工操作升级为可复制的工程能力。</text>
</svg>