<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">PatchPilot 补丁交付闭环</title><desc id="desc">从发现任务到结果回流的七阶段可审计补丁交付流程</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2F628D"/></marker>
  </defs>
  <rect width="1400" height="560" fill="#FFFFFF"/>
  <rect x="1" y="1" width="1398" height="558" rx="20" fill="none" stroke="#B9CBD9" stroke-width="2"/>
  <text x="64" y="72" fill="#163B5C" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="35" font-weight="700">PatchPilot：一次补丁交付如何形成闭环</text>
  <text x="64" y="110" fill="#5B7185" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19">每一步均产生可追溯证据；结果与失败原因回流到后续任务处理。</text>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <g transform="translate(64 185)"><rect width="160" height="136" rx="14" fill="#EFF6FA" stroke="#78A9C9"/><text x="20" y="38" fill="#2F628D" font-size="18" font-weight="700">01</text><text x="20" y="77" fill="#163B5C" font-size="24" font-weight="700">发现任务</text><text x="20" y="108" fill="#5B7185" font-size="17">回合任务进入队列</text></g>
    <g transform="translate(254 185)"><rect width="160" height="136" rx="14" fill="#EFF6FA" stroke="#78A9C9"/><text x="20" y="38" fill="#2F628D" font-size="18" font-weight="700">02</text><text x="20" y="77" fill="#163B5C" font-size="24" font-weight="700">失败分析</text><text x="20" y="108" fill="#5B7185" font-size="17">日志与代码上下文</text></g>
    <g transform="translate(444 185)"><rect width="160" height="136" rx="14" fill="#EFF6FA" stroke="#78A9C9"/><text x="20" y="38" fill="#2F628D" font-size="18" font-weight="700">03</text><text x="20" y="77" fill="#163B5C" font-size="24" font-weight="700">可行性判断</text><text x="20" y="108" fill="#5B7185" font-size="17">依赖与风险分流</text></g>
    <g transform="translate(634 185)"><rect width="160" height="136" rx="14" fill="#E7F7F3" stroke="#4DB79C" stroke-width="2"/><text x="20" y="38" fill="#137B66" font-size="18" font-weight="700">04</text><text x="20" y="77" fill="#124E49" font-size="24" font-weight="700">AI 解冲突</text><text x="20" y="108" fill="#47736D" font-size="17">执行与失败记忆</text></g>
    <g transform="translate(824 185)"><rect width="160" height="136" rx="14" fill="#EFF6FA" stroke="#78A9C9"/><text x="20" y="38" fill="#2F628D" font-size="18" font-weight="700">05</text><text x="20" y="77" fill="#163B5C" font-size="24" font-weight="700">语义审查</text><text x="20" y="108" fill="#5B7185" font-size="17">多层质量校验</text></g>
    <g transform="translate(1014 185)"><rect width="160" height="136" rx="14" fill="#EFF6FA" stroke="#78A9C9"/><text x="20" y="38" fill="#2F628D" font-size="18" font-weight="700">06</text><text x="20" y="77" fill="#163B5C" font-size="24" font-weight="700">回检交付</text><text x="20" y="108" fill="#5B7185" font-size="17">PR 与检测轮次</text></g>
    <g transform="translate(1204 185)"><rect width="132" height="136" rx="14" fill="#EFF6FA" stroke="#78A9C9"/><text x="20" y="38" fill="#2F628D" font-size="18" font-weight="700">07</text><text x="20" y="77" fill="#163B5C" font-size="24" font-weight="700">沉淀</text><text x="20" y="108" fill="#5B7185" font-size="17">指标与证据</text></g>
  </g>
  <g stroke="#2F628D" stroke-width="2.5" marker-end="url(#arrow)"><path d="M224 253 H250"/><path d="M414 253 H440"/><path d="M604 253 H630"/><path d="M794 253 H820"/><path d="M984 253 H1010"/><path d="M1174 253 H1200"/></g>
  <path d="M1270 337 V404 H170 V337" fill="none" stroke="#4DB79C" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <rect x="365" y="388" width="670" height="84" rx="12" fill="#F4F8FA"/>
  <text x="700" y="424" text-anchor="middle" fill="#163B5C" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700">闭环的价值：不是一次“生成”，而是可验证的持续交付</text>
  <text x="700" y="455" text-anchor="middle" fill="#5B7185" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17">任务、日志、审查结论和交付结果共同构成下一轮优化的依据</text>
</svg>